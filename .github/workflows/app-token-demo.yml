name: app-token-demo
on: workflow_dispatch
permissions:
  contents: read
jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - id : app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{secrets.HWBENCH_CLIENT_ID}}
          private-key: ${{secrets.HWBENCH_APP_KEY}}
          owner: zhihanzzh
          repositories: dummy_hw
      - uses: actions/checkout@v6
        with:
          repository: zhihanzzh/jenkins_test
          token: ${{steps.app-token.outputs.token}}
          path: jenkins_test
      - run: ls -la jenkins_test