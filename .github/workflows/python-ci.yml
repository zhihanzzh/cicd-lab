name: python-ci

on: push

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Inspect Python and pip
        run: |
          python --version
          which python
          python -m pip --version

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Inspect pytest installation
        run: |
          python -m pip show pytest
          which pytest

      - name: Run tests
        run: pytest
